---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: graphrag
spec:
  interval: 10m
  url: oci://ghcr.io/polecatworks/graphrag/helm/graphrag
  ref:
    semver: ">= 0.1.x-0"
    semverFilter: .*-main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: graphrag
spec:
  releaseName: graphrag
  chartRef:
    kind: OCIRepository
    name: graphrag
  interval: 50m
  install:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/polecatworks/graphrag
      tag: main
      pullPolicy: Always
    config:
      llm:
        base_url: http://ollama.ollama:11434/v1
        model: llama3.1:8b
