apiVersion: v1
kind: Service
metadata:
  name: {{ include "graphrag.fullname" . }}
  labels:
    {{- include "graphrag.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.hamsPort }}
      targetPort: hams
      protocol: TCP
      name: hams
  selector:
    {{- include "graphrag.selectorLabels" . | nindent 4 }}
