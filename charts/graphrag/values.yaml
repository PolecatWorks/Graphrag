imagePullSecrets: []
replicaCount: 1

image:
  repository: ghcr.io/polecatworks/graphrag
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

container:
  port: 8080
  hamsPort: 8079

service:
  type: ClusterIP
  port: 80
  hamsPort: 8079

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []
volumeMounts: []
volumes: []

config: {}
