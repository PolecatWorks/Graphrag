name: Helm CI (Main)

on:
  push:
    branches:
      - main
    paths:
      - 'charts/graphrag/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
      - name: Helm Lint
        run: helm lint charts/graphrag
      - name: Stamp Chart
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%s)
          sed -i "s/version: .*/version: 0.1.0-main-${TIMESTAMP}-${SHA_SHORT}/" charts/graphrag/Chart.yaml
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push Chart
        uses: bsord/helm-push@v4
        with:
          useOCIRegistry: true
          registry-url: oci://ghcr.io/polecatworks/graphrag/helm
          chart-folder: charts/graphrag
