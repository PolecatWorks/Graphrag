name: Docker Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'config.yaml'
              - 'Dockerfile'
              - '.github/workflows/docker-publish.yml'

  check-image:
    runs-on: ubuntu-latest
    needs: check-paths
    if: ${{ needs.check-paths.outputs.backend == 'true' }}
    outputs:
      content_sha: ${{ steps.compute.outputs.content_sha }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: compute
        run: |
          CONTENT_SHA=$(git log -1 --format=%H -- src/ migrations/ Cargo.toml Cargo.lock config.yaml Dockerfile .github/workflows/docker-publish.yml)
          echo "content_sha=$CONTENT_SHA" >> $GITHUB_OUTPUT
      - id: check
        run: |
          if docker manifest inspect ghcr.io/polecatworks/graphrag:sha-${{ steps.compute.outputs.content_sha }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-image
    if: ${{ needs.check-image.outputs.exists != 'true' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            runner: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Digest
        id: build
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/polecatworks/graphrag:buildcache-linux-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/polecatworks/graphrag:buildcache-linux-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/polecatworks/graphrag:buildcache-linux-${{ matrix.arch }},mode=max
          outputs: type=image,name=ghcr.io/polecatworks/graphrag,push-by-digest=true,name-canonical=true
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [check-image, build]
    if: ${{ needs.check-image.outputs.exists != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Merge and Push Manifest
        run: |
          docker buildx imagetools create -t ghcr.io/polecatworks/graphrag:sha-${{ needs.check-image.outputs.content_sha }} \
            $(printf "ghcr.io/polecatworks/graphrag@sha256:%s " $(ls /tmp/digests))
      - name: Retag main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker buildx imagetools create -t ghcr.io/polecatworks/graphrag:main \
            -t ghcr.io/polecatworks/graphrag:latest \
            ghcr.io/polecatworks/graphrag:sha-${{ needs.check-image.outputs.content_sha }}

  retag:
    needs: check-image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-image.outputs.exists == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag existing image to main/latest
        run: |
          docker buildx imagetools create -t ghcr.io/polecatworks/graphrag:main \
            -t ghcr.io/polecatworks/graphrag:latest \
            ghcr.io/polecatworks/graphrag:sha-${{ needs.check-image.outputs.content_sha }}

  rollout-dev:
    needs: [merge, retag]
    if: always() && (needs.merge.result == 'success' || needs.retag.result == 'success') && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: polecatworks-runner
    steps:
      - name: Rollout restart
        run: kubectl rollout restart deployment/graphrag -n graphrag-dev

  ci-success:
    name: Graphrag Docker Success
    needs: [merge, retag]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker CI successful."
