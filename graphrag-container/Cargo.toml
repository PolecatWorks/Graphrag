[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = "0.42.0"
axum = { version = "0.8.9", features = ["macros", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
hams = { git = "https://github.com/PolecatWorks/hams.git", version = "0.3.0" }
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["tls-rustls", "runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19" }
tower = { version = "0.5.3", features = ["util", "make"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
rmcp = { version = "3.2.0", features = ["server", "macros", "schemars"] }
schemars = "0.8"

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.27.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
