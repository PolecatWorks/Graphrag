database:
  url: "postgres://postgres:mysecretpassword@localhost:5432/graphrag"
  pool_size: 10
  timeout_seconds: 30
server_host: "127.0.0.1"
server_port: 8080
hams:
  address: "127.0.0.1:8079"
  name: "graphrag"
  version: "0.1.0"
  logging: true
llm:
  provider: "ollama"
  base_url: "http://localhost:11434/v1"
  model: "llama3.1:8b"
  timeout_seconds: 60
mcp:
  enabled: true
  api_prefix: "/api"
  server_name: "graphrag-mcp"
  instructions: "GraphRAG-RS Model Context Protocol Server for knowledge graph ingestion, hybrid RAG querying, and BREAD data management."
logging:
  level: "info"
