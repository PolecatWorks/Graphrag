kind: Deploy
type: kubernetes
name: robot-test-runner
dependencies:
  - deploy.graphrag
spec:
  manifests:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: robot-test-runner
        labels:
          app: robot-test-runner
      spec:
        containers:
          - name: robot
            image: marketsquare/robotframework-browser:latest
            command: ["/bin/bash", "-c", "sleep infinity"]
            securityContext:
              runAsUser: 1001
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi

---
kind: Test
type: exec
name: integration-all
timeout: 900
dependencies:
  - deploy.robot-test-runner
spec:
  command: ["/bin/bash", "-c", "if [ -f ./integration-tests/run-tests.sh ]; then GARDEN_NAMESPACE=${environment.namespace} ./integration-tests/run-tests.sh; else (cd .. && GARDEN_NAMESPACE=${environment.namespace} ./integration-tests/run-tests.sh); fi"]
